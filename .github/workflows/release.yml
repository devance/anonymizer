# Builds the desktop app for macOS (Apple Silicon) and Windows (x64).
# - A tag vX.Y.Z (matching desktop/src-tauri/tauri.conf.json) builds both and
#   puts them in a draft GitHub release under fixed names, the ones devance.ca
#   links to through releases/latest/download/. Publishing the draft is by hand.
# - Run by hand (Actions > Release > Run workflow) it builds any branch and
#   keeps the files as workflow artifacts only.
# Signing needs the APPLE_* and CODESIGN_* secrets used below, kept in the
# "release" environment, which only v* tags can use: a manual run builds
# unsigned. Without them the build still runs, and the release stays a draft
# for checking only. Only people with write access can push a tag or run it by
# hand, and these jobs never run for pull requests. Third-party actions, which
# see the signing secrets, are pinned by commit.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 150
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, app version $v"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/cache@v6
        with:
          path: |
            engine/ner
            engine/tessdata
          key: models-${{ hashFiles('engine/ner.lock.json', 'engine/tessdata.lock.json') }}
      - uses: actions/cache@v6
        with:
          path: desktop/src-tauri/binaries
          key: llama-mac-${{ hashFiles('desktop/llama.lock.json', 'desktop/scripts/build-llama-mac.sh') }}
      - run: npm ci
      - id: signing
        run: echo "signed=$([ -n "$APPLE_CERTIFICATE_BASE64" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Developer ID certificate in a temporary keychain
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          PW="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build, sign, notarize
        run: desktop/scripts/release-mac.sh
      - name: Collect
        run: |
          mkdir -p out
          cp desktop/build/release/*/Devance-Anonymiseur_*_aarch64.dmg out/Devance-Anonymiseur-macOS.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: out/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        shell: bash
    env:
      CODESIGN_USERNAME: ${{ secrets.CODESIGN_USERNAME }}
      CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
      CODESIGN_CREDENTIAL_ID: ${{ secrets.CODESIGN_CREDENTIAL_ID }}
      CODESIGN_TOTP_SECRET: ${{ secrets.CODESIGN_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/cache@v6
        with:
          path: |
            engine/ner
            engine/tessdata
          key: models-${{ hashFiles('engine/ner.lock.json', 'engine/tessdata.lock.json') }}
      - run: npm ci
      - id: signing
        run: echo "signed=$([ -n "$CODESIGN_CREDENTIAL_ID" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: CodeSignTool (SSL.com eSigner)
        if: env.CODESIGN_CREDENTIAL_ID != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
      - name: Install CodeSignTool
        if: env.CODESIGN_CREDENTIAL_ID != ''
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip -OutFile "$env:RUNNER_TEMP\CodeSignTool.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\CodeSignTool.zip" -DestinationPath C:\CodeSignTool -Force
          cmd /c mklink /D "C:\CodeSignTool\jdk-11.0.2" "$env:JAVA_HOME"
      - name: Build, sign
        run: desktop/scripts/release-windows.sh
      - name: Collect
        run: |
          mkdir -p out
          cp desktop/build/release/*/Devance-Anonymiseur_*_x64-setup.exe out/Devance-Anonymiseur-Windows-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNED: ${{ needs.mac.outputs.signed == 'yes' && needs.windows.outputs.signed == 'yes' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Draft release
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          Devance Anonymiseur $v (bêta / beta)

          - macOS 14+, Apple Silicon : Devance-Anonymiseur-macOS.dmg
          - Windows 10 / 11, x64 : Devance-Anonymiseur-Windows-setup.exe
          - SHA-256 : SHA256SUMS.txt

          Logiciel libre sous licence AGPL 3.0. Free software under the AGPL 3.0 license.
          EOF
          [ "$SIGNED" = true ] || printf '\n**Unsigned build: do not publish.**\n' >> notes.md
          files=(Devance-Anonymiseur-macOS.dmg Devance-Anonymiseur-Windows-setup.exe SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --title "Devance Anonymiseur $v" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          fi
