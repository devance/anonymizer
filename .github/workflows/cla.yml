# Asks every outside contributor to accept CLA.md once, in the pull request.
# Signatures go to signatures/v1/cla.json on the unprotected cla-signatures
# branch. This workflow never checks out the PR's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/devance/anonymizer/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: gabgren,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Merci pour cette contribution. Avant de la fusionner, nous vous demandons
            d'accepter une fois notre [accord de licence de contribution](https://github.com/devance/anonymizer/blob/main/CLA.md) :
            vous restez titulaire de vos droits et Devance peut distribuer le projet sous
            AGPL 3.0 et sous licence commerciale. Pour l'accepter, publiez la phrase
            ci-dessous en commentaire.
            <br/><br/>
            Thanks for this contribution. Before we merge it, please accept our
            [Contributor License Agreement](https://github.com/devance/anonymizer/blob/main/CLA.md#english-version)
            once: you keep your rights, and Devance can distribute the project under the
            AGPL 3.0 and under a commercial license. To accept it, post the sentence below
            as a comment.
