[package]
name = "devance-anonymizer"
version = "0.2.0"
description = "Devance Anonymiseur"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "anon_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"
hex = "0.4"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs", "macros", "rt-multi-thread", "net"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

# Argon2 at 256 MiB is unbearably slow unoptimized; keep dev unlocks near release speed.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
